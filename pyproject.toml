[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videowipe"
version = "0.5.0"
description = "Video inpainting library for removing subtitles, watermarks, and text overlays"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.5,<5",
    "numpy",
    "tqdm",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "torchvision",
]
onnx = [
    "onnxruntime>=1.15",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.15",
]
# Compatibility alias: the default runtime is now already headless.
headless = []
ocr = [
    "rapidocr-onnxruntime",
]
web = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
]
propainter = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]
all = [
    "videowipe[torch]",
    "videowipe[onnx]",
]
dev = ["pytest", "ruff", "build", "httpx2>=2,<3"]

[project.scripts]
videowipe = "videowipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videowipe"]

[tool.hatch.build.targets.sdist]
include = [
    "/examples",
    "/scripts/propainter_wipe.py",
    "/scripts/smoke_installed.py",
    "/scripts/verify_package.py",
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/README_CN.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videowipe"
version = "0.4.0"
description = "Video inpainting library for removing subtitles, watermarks, and text overlays"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5",
    "numpy",
    "tqdm",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "torchvision",
]
onnx = [
    "onnxruntime>=1.15",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.15",
]
headless = [
    "opencv-python-headless>=4.5",
]
ocr = [
    "rapidocr-onnxruntime",
]
web = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
]
all = [
    "videowipe[torch]",
    "videowipe[onnx]",
]
dev = ["pytest", "ruff"]

[project.scripts]
videowipe = "videowipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videowipe"]

[tool.pytest.ini_options]
pythonpath = ["src"]

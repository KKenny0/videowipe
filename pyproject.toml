[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videowipe"
version = "0.1.0"
description = "STTN-based video inpainting tool for removing hardcoded subtitles"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "torchvision",
]
onnx = [
    "onnxruntime>=1.15",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.15",
]
headless = [
    "opencv-python-headless>=4.5",
]
all = [
    "videowipe[torch]",
    "videowipe[onnx]",
]
dev = ["pytest", "ruff"]

[project.scripts]
videowipe = "videowipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videowipe"]

[tool.pytest.ini_options]
pythonpath = ["src"]

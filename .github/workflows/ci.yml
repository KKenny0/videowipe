name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,web]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python scripts/verify_package.py dist
      - name: Smoke test installed wheel
        shell: bash
        run: |
          python -m venv .package-venv
          wheel=$(echo dist/*.whl)
          .package-venv/bin/python -m pip install "${wheel}[propainter]"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.package-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          "$GITHUB_WORKSPACE/.package-venv/bin/videowipe" --help
          "$GITHUB_WORKSPACE/.package-venv/bin/python" -m videowipe.propainter_wipe --help
          "$GITHUB_WORKSPACE/.package-venv/bin/python" -m pip check
